<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rotary Wheel Emblem -->
  <circle cx="50" cy="50" r="46" fill="#005DAA"/>
  <!-- Outer Gear Teeth / Rim in Rotary Gold -->
  <circle cx="50" cy="50" r="42" fill="#FEBD11"/>
  <circle cx="50" cy="50" r="34" fill="#005DAA"/>
  <!-- Inner Spokes in Gold -->
  <g stroke="#FEBD11" stroke-width="4" stroke-linecap="round">
    <line x1="50" y1="18" x2="50" y2="82"/>
    <line x1="18" y1="50" x2="82" y2="50"/>
    <line x1="27.4" y1="27.4" x2="72.6" y2="72.6"/>
    <line x1="27.4" y1="72.6" x2="72.6" y2="27.4"/>
  </g>
  <!-- Center Hub -->
  <circle cx="50" cy="50" r="14" fill="#FEBD11"/>
  <circle cx="50" cy="50" r="6" fill="#005DAA"/>
  <circle cx="50" cy="50" r="2.5" fill="#FEBD11"/>
  <!-- Keyway notch on center hub -->
  <rect x="48.5" y="44" width="3" height="4" fill="#005DAA"/>
</svg>